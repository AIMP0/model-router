[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimp-model-router"
version = "0.2.0"
description = "Model routing, CLIProxyAPI deployment and authenticated balance dashboard"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["mcp>=1.28,<2"]

[tool.setuptools.packages.find]
include = ["aimp_router*"]

[tool.setuptools.package-data]
aimp_router = ["web/*.html", "web/*.js", "web/*.css"]
